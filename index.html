<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>い形容詞・な形容詞 分類ゲーム</title><style>body{font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP',sans-serif;background:#f6f8fb;color:#172338;margin:0;padding:16px}main{max-width:900px;margin:auto}h1{font-size:clamp(22px,4vw,32px);text-align:center}.intro{text-align:center}.pool,.zone{background:white;border:2px solid #cbd5e1;border-radius:16px;padding:14px;min-height:120px}.zones{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.zone{border-style:dashed;min-height:220px}.zone[data-zone=i]{border-color:#438dd3}.zone[data-zone=na]{border-color:#dc9753}.zone h2{text-align:center;font-size:22px;margin:2px 0 10px}.cards{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;align-content:start;min-height:65px}.word{touch-action:none;user-select:none;-webkit-user-select:none;border:2px solid #b7c7da;border-radius:10px;background:#fff;padding:12px 15px;font-size:clamp(17px,3vw,23px);font-weight:700;cursor:grab;box-shadow:0 2px 5px #0001}.word.selected{outline:4px solid #f5bc40}.word.good{border-color:#159464;background:#e5f7ef}.word.bad{border-color:#ce4242;background:#ffecec}.zone.over{background:#eaf4ff}button.action{font-size:19px;border-radius:12px;padding:12px 18px;border:1px solid #a8b4c5;background:white;cursor:pointer}button.primary{background:#176dc1;color:white;border-color:#176dc1}.actions{display:flex;gap:10px;margin-top:16px}.actions button:first-child{flex:1}#feedback{min-height:30px;font-weight:700;text-align:center;margin:14px}#dragGhost{position:fixed;pointer-events:none;z-index:1000;opacity:.88;transform:translate(-50%,-50%);display:none}.note{font-size:14px;color:#526176}#progress{text-align:right;font-size:14px;color:#526176}@media(max-width:520px){.zones{gap:8px}.zone{padding:8px}.zone h2{font-size:18px}.word{padding:10px 8px}.pool{padding:10px}}</style></head><body><main><h1>い形容詞？ な形容詞？</h1><p class="intro">ことばを ただしい はこに いれよう！</p><p id="progress"></p><section class="pool" data-zone="pool"><strong>ことばカード</strong><div id="pool" class="cards"></div></section><div class="zones"><section class="zone" data-zone="i"><h2>い形容詞</h2><div class="cards"></div></section><section class="zone" data-zone="na"><h2>な形容詞</h2><div class="cards"></div></section></div><p class="note">カードを指で動かすか、カードをタップしてから箱をタップしてね。箱の中のカードをタップすると元に戻るよ。</p><div class="actions"><button id="check" class="action primary">こたえあわせ</button><button id="reset" class="action">もういちど</button></div><div id="feedback" aria-live="polite"></div></main><div id="dragGhost" class="word"></div><script>(()=>{'use strict';const words=[['おおきい','i'],['しずか','na'],['たのしい','i'],['きれい','na'],['あつい','i'],['げんき','na'],['おもしろい','i'],['ゆうめい','na'],['さむい','i'],['すき','na'],['かわいい','i'],['べんり','na']];const pool=document.querySelector('#pool'),zones=[...document.querySelectorAll('[data-zone]')],ghost=document.querySelector('#dragGhost');let selected=null,drag=null,suppressClick=false;function clear(){document.querySelectorAll('.word.selected').forEach(e=>e.classList.remove('selected'));selected=null}function update(){const n=12-pool.children.length;document.querySelector('#progress').textContent=n+' / 12 分類済み'}function move(card,zone){if(!card||!zone)return;zone.querySelector('.cards').appendChild(card);card.classList.remove('good','bad');clear();document.querySelector('#feedback').textContent='';update()}function getZone(x,y){const el=document.elementFromPoint(x,y);return el&&el.closest('[data-zone]')}function make(w,i){const b=document.createElement('button');b.type='button';b.className='word';b.textContent=w[0];b.dataset.answer=w[1];b.dataset.id=i;b.addEventListener('click',()=>{if(suppressClick)return;if(b.parentElement===pool){clear();selected=b;b.classList.add('selected')}else move(b,document.querySelector('[data-zone=pool]'))});b.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={card:b,x:e.clientX,y:e.clientY,moved:false,pointerId:e.pointerId};b.setPointerCapture(e.pointerId)});b.addEventListener('pointermove',e=>{if(!drag||drag.card!==b)return;if(!drag.moved&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){drag.moved=true;ghost.textContent=b.textContent;ghost.style.display='block';b.style.opacity='.3'}if(drag.moved){ghost.style.left=e.clientX+'px';ghost.style.top=e.clientY+'px';zones.forEach(z=>z.classList.toggle('over',z===getZone(e.clientX,e.clientY)))}});function end(e){if(!drag||drag.card!==b)return;const moved=drag.moved;drag=null;ghost.style.display='none';b.style.opacity='';zones.forEach(z=>z.classList.remove('over'));if(moved){suppressClick=true;setTimeout(()=>suppressClick=false,80);const zone=getZone(e.clientX,e.clientY);if(zone)move(b,zone)}}b.addEventListener('pointerup',end);b.addEventListener('pointercancel',()=>{drag=null;ghost.style.display='none';b.style.opacity='';zones.forEach(z=>z.classList.remove('over'))});return b}zones.forEach(z=>z.addEventListener('click',e=>{if(e.target.closest('.word'))return;if(selected)move(selected,z)}));function init(){zones.forEach(z=>z.querySelector('.cards').replaceChildren());words.forEach((w,i)=>pool.appendChild(make(w,i)));clear();document.querySelector('#feedback').textContent='';update()}document.querySelector('#check').addEventListener('click',()=>{let correct=0;document.querySelectorAll('.zone .word').forEach(b=>{const good=b.closest('.zone').dataset.zone===b.dataset.answer;b.classList.toggle('good',good);b.classList.toggle('bad',!good);if(good)correct++});document.querySelector('#feedback').textContent=correct+' / 12 正解！ '+(pool.children.length?'まだ分けていないカードがあるよ。':correct===12?'ぜんぶ正解！すばらしい！':'赤いカードをもういちど考えてみよう。')});document.querySelector('#reset').addEventListener('click',init);init()})();</script></body></html>
